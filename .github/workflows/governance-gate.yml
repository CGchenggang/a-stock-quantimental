name: governance-gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-scope-conflict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate task manifest and Scope Gate
        run: |
          python scripts/governance_gate.py \
            --base "$GITHUB_BASE_SHA" \
            --head "$GITHUB_SHA"

      - name: Conflict Gate and Shared Interface Lock
        run: |
          MANIFESTS=$(git diff --name-only --diff-filter=ACMRD "$GITHUB_BASE_SHA...$GITHUB_SHA" -- '.agent/tasks/*.json')
          COUNT=$(printf '%s\n' "$MANIFESTS" | sed '/^$/d' | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "FAIL: expected exactly one PR-local task manifest in this diff, found $COUNT"
            printf '%s\n' "$MANIFESTS"
            exit 1
          fi
          python scripts/governance_conflict_gate.py \
            --manifest "$MANIFESTS" \
            --registry ".agent/active-tasks.json"

      - name: v2.2 self-test
        run: |
          python scripts/test_governance_v22.py
