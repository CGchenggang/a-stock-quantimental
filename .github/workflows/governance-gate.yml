name: governance-gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-scope-conflict-control-plane:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scope Gate
        run: |
          python scripts/governance_gate.py \
            --base "$GITHUB_BASE_SHA" \
            --head "$GITHUB_SHA"

      - name: State Machine Gate
        run: |
          python scripts/test_governance_state_gate.py
