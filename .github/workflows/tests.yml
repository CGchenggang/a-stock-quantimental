name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Environment diagnostics
        run: |
          python --version
          python -m pip --version
          python -m pytest --version
          python -m pytest --collect-only -q -ra
      - name: Contract Harness audit (P14-C)
        run: python scripts/audit_p14c_contract.py
      - name: Core data and model tests
        run: |
          python -m pytest -q -ra \
            tests/test_pit.py \
            tests/test_pit_adapter.py \
            tests/test_pit_adapter_daily.py \
            tests/test_legacy_cache.py \
            tests/test_legacy_cache_pit.py \
            tests/test_legacy_provider.py \
            tests/test_legacy_adapter.py \
            tests/test_freshness.py \
            tests/test_model_evaluation.py \
            tests/test_ledger_metrics.py
      - name: Agent, backtest and ledger tests
        run: |
          python -m pytest -q -ra \
            tests/test_agent_ledger.py \
            tests/test_backtest.py \
            tests/test_compat.py \
            tests/test_p7_integration.py \
            tests/test_postmortem.py
      - name: P8 regression tests
        run: |
          python -m pytest -q -ra \
            tests/test_p8c_regression.py \
            tests/test_p8c_legacy_intraday_semantics.py \
            tests/test_p8d_orchestration.py \
            tests/test_regime.py
      - name: P13-M pooled industry regression
        run: |
          python -m pytest -q -ra tests/test_industry_relative.py
      - name: Full pytest suite
        run: |
          python -m pytest -q -ra

  p13m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: P13-M pooled industry regression
        run: python -m pytest -q -ra tests/test_industry_relative.py
