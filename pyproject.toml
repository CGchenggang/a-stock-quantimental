[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-stock-quantimental-v2"
version = "0.1.0"
description = "A-share Quantimental Agent + quantitative research engine"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2","numpy>=1.26","scikit-learn>=1.5","pydantic>=2.7","PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
